---
# Scale this inventory by assigning each host to a platform, role, and site group.
# Example target groups for a ~400 device estate:
# - platform: cisco_ios, cisco_wlc, extreme_exos, aruba_aoscx, aruba_wlc
# - role: access_switches, distribution_switches, core_switches, wireless_controllers
# - site: site_lisbon, site_porto, site_madrid, site_barcelona

cisco_ios:
  platform: cisco_ios
  data:
    vendor: cisco
    os_family: ios

cisco_wlc:
  platform: cisco_wlc_ssh
  data:
    vendor: cisco
    os_family: aireos

extreme_exos:
  platform: extreme_exos
  data:
    vendor: extreme
    os_family: exos

aruba_aoscx:
  platform: aruba_aoscx
  data:
    vendor: aruba
    os_family: aoscx

aruba_wlc:
  platform: aruba_os
  data:
    vendor: aruba
    os_family: arubaos

access_switches:
  data:
    role: access_switch

distribution_switches:
  data:
    role: distribution_switch

core_switches:
  data:
    role: core_switch

wireless_controllers:
  data:
    role: wireless_controller

site_lisbon:
  data:
    site: Lisbon
    timezone: Europe/Lisbon
    ntp_servers:
      - 10.10.10.10
      - 10.10.10.11

site_porto:
  data:
    site: Porto
    timezone: Europe/Lisbon
    ntp_servers:
      - 10.20.10.10
      - 10.20.10.11

site_madrid:
  data:
    site: Madrid
    timezone: Europe/Madrid
    ntp_servers:
      - 10.30.10.10
      - 10.30.10.11

site_barcelona:
  data:
    site: Barcelona
    timezone: Europe/Madrid
    ntp_servers:
      - 10.40.10.10
      - 10.40.10.11
