---
# =============================================================================
# PLATFORM GROUPS
# Defines the connection type and driver Nornir uses (Scrapli, Netmiko, etc.)
# These use the 'platform' native attribute.
# =============================================================================
extreme_exos_devices:
    platform: extreme_exos
aruba_os_devices:
    platform: aruba_os
aruba_aoscx_devices:
    platform: aruba_aoscx

# =============================================================================
# ROLE GROUPS
# Used for functional filtering, place inside the 'data' dictionary 
# because 'role' is not a native Nornir host attribute.
# =============================================================================
core_switches:
    data:
        role: core
distribution_switches:
    data:
        role: distribution
access_switches:
    data:
        role: access
wireless_controllers:
    data:
        role: wireless

# =============================================================================
# SITE GROUPS (Regional Settings)
# Used to apply location-specific variables. This allows to change DNS 
# or NTP globally for a specific city without touching individual host files.
# =============================================================================
site_lisbon:
    data:
        dns_servers: [8.8.8.8, 8.8.4.4]
        ntp_server: "pt.pool.ntp.org"
site_porto:
    data:
        dns_servers: [1.1.1.1, 1.0.0.1]
        ntp_server: "pt.pool.ntp.org"