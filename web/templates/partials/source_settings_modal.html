<div class="modal" id="sourceSettingsModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content app-modal">
            <div class="modal-header">
                <div>
                    <h4 class="modal-title">Settings</h4>
                    <p class="modal-subtitle">Configure workspace paths and NetBox connection.</p>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
            </div>
            <div class="modal-body">
                <section class="settings-section">
                    <div class="settings-section-heading">
                        <h5>Root workspace</h5>
                    </div>
                    <label for="rootDirectoryInput">Directory</label>
                    <div class="input-with-button">
                        <input class="form-control" id="rootDirectoryInput" type="text" value="{{ root_directory or '' }}" placeholder="/path/to/root-workspace">
                        <button class="btn secondary-button" id="openRootBrowser" type="button">
                            <i class="fas fa-folder-open" aria-hidden="true"></i>
                            Browse
                        </button>
                    </div>
                    <small>Workspace that contains inputfiles and where outputfiles are saved.</small>
                    <div class="folder-browser" id="rootFolderBrowser" hidden>
                        <div class="folder-browser-header">
                            <button class="btn secondary-button btn-sm folder-up-button" id="rootBrowserUp" type="button">
                                <i class="fas fa-level-up-alt" aria-hidden="true"></i>
                            </button>
                            <span id="rootBrowserPath"></span>
                        </div>
                        <div class="folder-browser-list" id="rootBrowserList"></div>
                    </div>
                </section>

                <section class="settings-section">
                    <div class="settings-section-heading">
                        <h5>Inventory folder</h5>
                        <div class="folder-browser-status" id="folderBrowserStatus"></div>
                    </div>
                    <label for="inventoryRootDirectory">Directory</label>
                    <div class="input-with-button">
                        <input class="form-control" id="inventoryRootDirectory" type="text" value="{{ inventory_directory or '' }}" placeholder="/path/to/inventory">
                        <button class="btn secondary-button" id="openInventoryBrowser" type="button">
                            <i class="fas fa-folder-open" aria-hidden="true"></i>
                            Browse
                        </button>
                    </div>
                    <small>Folder must contain <code>defaults.yaml</code>, <code>groups.yaml</code>, and <code>hosts.yaml</code>.</small>
                    <div class="folder-browser" id="inventoryFolderBrowser" hidden>
                        <div class="folder-browser-header">
                            <button class="btn secondary-button btn-sm folder-up-button" id="folderBrowserUp" type="button">
                                <i class="fas fa-level-up-alt" aria-hidden="true"></i>
                            </button>
                            <span id="folderBrowserPath"></span>
                        </div>
                        <div class="folder-browser-list" id="folderBrowserList"></div>
                    </div>
                </section>

                <section class="settings-section">
                    <div class="settings-section-heading">
                        <h5>NetBox</h5>
                        <div class="folder-browser-status" id="netboxConnectionStatus"></div>
                    </div>
                    <label for="netboxUrl">URL</label>
                    <input class="form-control" id="netboxUrl" type="url" value="{{ netbox_url or '' }}" placeholder="https://netbox.example.com">
                    <label for="netboxToken">API key</label>
                    <input
                        class="form-control"
                        id="netboxToken"
                        type="password"
                        placeholder="{{ 'Token is saved (hidden)' if netbox_token_saved else 'Paste API token' }}"
                    >
                </section>
                <div class="settings-message" id="targetSettingsMessage"></div>
            </div>
            <div class="modal-footer modal-footer-right">
                <button class="btn primary-button" id="targetSettingsSave" type="button">
                    <i class="fas fa-save" aria-hidden="true"></i>
                    Save
                </button>
            </div>
        </div>
    </div>
</div>
