<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PANDA{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block stylesheets %}{% endblock %}
    <script>
        (function() {
            var expanded = false;
            try {
                expanded = sessionStorage.getItem('panda.sidebar.expanded') === 'true';
            } catch (error) {
                expanded = false;
            }
            document.documentElement.classList.add(expanded ? 'sidebar-expanded' : 'sidebar-collapsed');
        })();
    </script>
</head>
<body class="app-body">
    <aside class="sidebar" aria-label="Primary navigation">
        <button class="sidebar-brand sidebar-toggle" type="button" aria-label="Toggle navigation">
            <span class="brand-icon panda-mark" aria-hidden="true">
                <img src="https://cdn-icons-png.flaticon.com/512/8372/8372002.png" alt="">
            </span>
            <span class="brand-copy">
                <strong>PANDA</strong>
                <small>Collection</small>
            </span>
        </button>

        <nav class="sidebar-nav">
            <a class="sidebar-item{% if active_page == 'home' %} active{% endif %}" href="/" title="Home">
                <i class="fas fa-house" aria-hidden="true"></i>
                <span>Home</span>
            </a>
            <a class="sidebar-item{% if active_page == 'get_configs' %} active{% endif %}" href="/get_configs" title="Get Configurations">
                <i class="fas fa-download" aria-hidden="true"></i>
                <span>Get Configurations</span>
            </a>
            <a class="sidebar-item{% if active_page == 'update_netbox' %} active{% endif %}" href="/update_netbox" title="Update NetBox">
                <img class="sidebar-icon-img" src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/netbox-dark.svg" alt="" aria-hidden="true">
                <span>Update NetBox</span>
            </a>
        </nav>

        <div class="sidebar-tools" aria-label="Target source">
            <button class="sidebar-item sidebar-button source-switch target-source-button active" type="button" data-target-source="inventory" title="Toggle target source">
                <i class="fas fa-folder-tree" data-source-switch-folder aria-hidden="true"></i>
                <img class="sidebar-icon-img source-switch-img" src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/netbox-dark.svg" data-source-switch-netbox alt="" aria-hidden="true" hidden>
                <span data-source-current>Inventory</span>
            </button>
            <button class="sidebar-item sidebar-button" type="button" data-toggle="modal" data-target="#sourceSettingsModal" title="Settings">
                <i class="fas fa-gear" aria-hidden="true"></i>
                <span>Settings</span>
            </button>
        </div>
    </aside>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <div class="modal" id="sourceSettingsModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content app-modal">
                <div class="modal-header">
                    <div>
                        <h4 class="modal-title">Target Sources</h4>
                        <p class="modal-subtitle">Configure inventory files or NetBox access.</p>
                    </div>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
                </div>
                <div class="modal-body">
                    <section class="settings-section">
                        <h5>Inventory folder</h5>
                        <label for="inventoryRootDirectory">Directory</label>
                        <div class="input-with-button">
                            <input class="form-control" id="inventoryRootDirectory" type="text" value="{{ inventory_directory or '' }}" placeholder="/path/to/inventory">
                            <button class="btn secondary-button" id="openInventoryBrowser" type="button">
                                <i class="fas fa-folder-open" aria-hidden="true"></i>
                                Browse
                            </button>
                        </div>
                        <small>Folder must contain <code>defaults.yaml</code>, <code>groups.yaml</code>, and <code>hosts.yaml</code>.</small>
                        <div class="folder-browser" id="inventoryFolderBrowser" hidden>
                            <div class="folder-browser-header">
                                <button class="btn secondary-button btn-sm" id="folderBrowserUp" type="button">
                                    <i class="fas fa-level-up-alt" aria-hidden="true"></i>
                                </button>
                                <span id="folderBrowserPath"></span>
                            </div>
                            <div class="folder-browser-list" id="folderBrowserList"></div>
                            <button class="btn primary-button btn-sm" id="useCurrentFolder" type="button">Use this folder</button>
                        </div>
                    </section>

                    <section class="settings-section">
                        <h5>NetBox</h5>
                        <label for="netboxUrl">URL</label>
                        <input class="form-control" id="netboxUrl" type="url" value="{{ netbox_url or '' }}" placeholder="https://netbox.example.com">
                        <label for="netboxToken">API key</label>
                        <input class="form-control" id="netboxToken" type="password" placeholder="Paste API token">
                    </section>
                    <div class="settings-message" id="targetSettingsMessage"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn secondary-button" type="button" data-dismiss="modal">Cancel</button>
                    <button class="btn primary-button" id="saveTargetSettings" type="button">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
