<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PANDA{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block stylesheets %}{% endblock %}
    <script>
        (function() {
            var expanded = false;
            try {
                expanded = sessionStorage.getItem('panda.sidebar.expanded') === 'true';
            } catch (error) {
                expanded = false;
            }
            document.documentElement.classList.add(expanded ? 'sidebar-expanded' : 'sidebar-collapsed');
        })();
    </script>
</head>
<body class="app-body">
    {% include "partials/sidebar.html" %}

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/source_settings_modal.html" %}

    {% include "partials/scripts.html" %}
    {% block scripts %}{% endblock %}
</body>
</html>
